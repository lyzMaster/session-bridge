name: Check public first-use installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Download public bootstrap, install without runtimes, reuse offline
        run: bun scripts/bootstrap-smoke.ts
