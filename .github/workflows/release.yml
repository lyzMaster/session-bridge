name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test
      - run: bun run test:release
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-universal
            targets: macos-arm64,macos-x64
          - os: windows-2025
            target: windows-x64
            targets: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
          # Match the Windows baseline target to avoid Bun 1.3.6's cross-target ZIP extraction path.
          bun-download-url: ${{ runner.os == 'Windows' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.6/bun-windows-x64-baseline.zip' || '' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun build.ts --standalone --targets=${{ matrix.targets }}
      - name: Run native executable with no external runtimes on PATH
        run: bun scripts/native-smoke.ts
      - name: Resolve the exact artifact directory
        id: output
        run: bun -e "await Bun.write(process.env.GITHUB_OUTPUT, 'directory=dist/standalone-' + (await Bun.file('package.json').json()).version + '\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.output.outputs.directory }}/
          if-no-files-found: error
          retention-days: 1
  network:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/resumable-transfer'
    needs: [source, native]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: dist/network-artifact
      - name: Verify a 95 MiB synthetic public transfer with the standalone executable
        run: bun scripts/network-smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: network-verification
          path: network-verification.json
          if-no-files-found: error
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/platforms
      - name: Verify platform reports and publish fixed-version assets
        run: bun scripts/release.ts --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
